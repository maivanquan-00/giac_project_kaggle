data:
  data_dir:  "/kaggle/input/datasets/maivanquan/datn-2025-2/data_final"
  graph_dir: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph"
  manifest_file: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph/humanmethylation450_15017482_v1-2.csv"
  cancer_types: ["COAD", "ESCA", "READ", "STAD"]

preprocessing:
  gene_top_k:   3500
  meth_top_k:   3500
  mirna_top_k:  null      # null = dùng tất cả miRNA sau low-expression filter (~593)
  feature_selection_method: "anova"
  val_size:  0.15
  cv_folds:  5
  minority_boost_gene:  300
  minority_boost_meth:  200
  minority_boost_mirna: 0
  minority_classes: [1, 3, 4]   # GS (n=108), HM-SNV (n=19), EBV (n=30) bị CIN (n=624) đè trong ANOVA
  stratify_by_cancer_type: true  # cân bằng fold theo cả Cancer_Type và subtype khi có thể

graph:
  emqtl_pval_threshold:    0.05
  max_edges_per_node:      20
  max_coregulation_edges:  10
  ppi_score_threshold:     700
  use_ppi:          true
  use_reactome:     true
  use_mirna:        true
  use_mirna_family: true
  reactome_max_pathway_size: 50
  max_targets_per_mirna:    100
  use_cpg_island:      true   # true để bật CpG↔CpG edges (cần manifest_file trong data)
  cpg_island_relation: "Island+Shore"  # "Island" | "Island+Shore" | "all"

model:
  hidden_dim:  96                # Phase 4d sweet spot (96 better than 64 or 128)
  gat_heads:   4                 # Phase 4d/5b confirmed: 4 heads optimal (5b 8 heads = tie)
  gat_layers:  2
  gat_dropout: 0.3                # Phase 4c keep: 0.5→0.3 worked +0.03 val F1
  topk_seq:    32
  ca_heads:    4
  ca_dropout:  0.4
  sparsemax_alpha: 1.5   # entmax15
  num_classes: 5
  classifier_dropout: 0.5
  final_dim:   32

training:
  epochs:      150
  batch_size:  32
  learning_rate:     1.0e-4
  max_learning_rate: 5.0e-4
  scheduler: "onecycle"
  onecycle_pct_start:        0.1
  onecycle_div_factor:       10.0
  onecycle_final_div_factor: 100.0
  weight_decay:          5.0e-3   # Stage 2A: tăng từ 3e-3 (chống overfit train F1=0.93)
  node_emb_weight_decay: 1.5e-2
  focal_gamma:     2.0
  focal_alpha:     [1.0, 4.5, 1.5, 8.0, 2.0]   # overridden at runtime by compute_class_weights (unless use_manual_focal_alpha=true)
  label_smoothing: 0.05
  balanced_sampler: false
  lambda_frobenius: 0.002          # Stage 2A: tăng từ 0.001 (bù W_out không bị reg)
  patience: 15                     # Stage 2A: giảm từ 20 (stop overfit sớm hơn)
  min_epochs: 40                   # ngăn stop quá sớm trước khi OneCycle warmup + một số epochs phát huy max_lr
  model_selection_metric: "val_f1"
  seed: 42
  loss_name: "focal"
  subtype_names: ["CIN", "GS", "MSI", "HM-SNV", "EBV"]
  minority_augmentation:
    enabled: true
    class: [1, 3, 4]   # Stage 2B: thêm EBV=4 (GS=1, HM-SNV=3, EBV=4)
    noise_std: 0.10
  # Stochastic Weight Averaging — v3 pure: keep OneCycle running, chỉ collect
  # averages on top (KHÔNG dùng SWALR). Vanilla model 100% preserved.
  # Model dùng LayerNorm only → không cần update_bn.
  #
  # Tuning history:
  # - v1 (start=40, swa_lr=5e-5, paused OneCycle): SWA ≈ vanilla, ko hiệu quả.
  # - v2 (start=30, swa_lr=1e-4, paused OneCycle): SWA test cải thiện rõ (Δstd
  #   -0.022 F1, Δstd -0.0094 Acc) NHƯNG vanilla bị disturb (val-test gap +0.12)
  #   → vanilla mean drop 0.71→0.65; pick logic chọn vanilla noisy → final giảm.
  # - v3 (start=30, no SWALR): main scheduler không bị động → vanilla preserved.
  swa:
    enabled: true
    start_epoch: 30       # epoch bắt đầu collect (OneCycle decay đến epoch 150)
    update_freq: 1        # update_parameters mỗi N epoch

logging:
  save_dir:     "/kaggle/working/checkpoints/"
  log_interval: 5
  print_classification_report: true

interpretability:
  top_k_features: 50
