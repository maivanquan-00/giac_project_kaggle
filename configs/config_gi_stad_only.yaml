# STAD-only ablation: isolate multi-cancer heterogeneity confound
# Khi loại COAD/READ/ESCA, GIAC có đạt F1 cao hơn GI gộp không?

data:
  data_dir:  "/kaggle/input/datasets/maivanquan/datn-2025-2/data_final"
  graph_dir: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph"
  manifest_file: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph/humanmethylation450_15017482_v1-2.csv"
  cancer_types: ["STAD"]   # chỉ STAD — vừa filter samples, vừa chọn emQTL file

preprocessing:
  # Tuning 2026-05-24 final: revert to v2 (features 3500).
  # Methodology pivot: vanilla-primary reporting (không SWA), v2 vanilla numbers
  # beat MoXGATE clearly: Acc +0.020, F1w +0.037, F1m +0.031.
  # Train-Val gap +0.19 borderline nhưng Val-Test gap chỉ +0.02 → generalize OK.
  gene_top_k:   3500
  meth_top_k:   3500
  mirna_top_k:  null      # null = dùng tất cả miRNA sau low-expression filter (~593)
  feature_selection_method: "anova"
  val_size:  0.15
  cv_folds:  5
  minority_boost_gene:  400      # cao hơn GI vì n nhỏ hơn — bù đắp cho EBV/GS/HM-SNV
  minority_boost_meth:  300      # same
  minority_boost_mirna: 0
  minority_classes: [1, 3, 4]   # GS=1, HM-SNV=3, EBV=4 — cả 3 minority trong STAD

graph:
  emqtl_pval_threshold:    0.05
  max_edges_per_node:      20
  max_coregulation_edges:  10
  ppi_score_threshold:     700
  use_ppi:          true
  use_reactome:     true
  use_mirna:        true
  use_mirna_family: true
  reactome_max_pathway_size: 50
  max_targets_per_mirna:    100
  use_cpg_island:      true   # sync GI combined: 13 relations
  cpg_island_relation: "Island+Shore"

model:
  # Final: revert về GIAC default architecture (hidden 96, K 32) cho consistency
  # với 9 datasets khác. Vanilla v2 cho numbers tốt nhất.
  hidden_dim:  96
  gat_heads:   4
  gat_layers:  2
  gat_dropout: 0.3
  topk_seq:    32
  ca_heads:    4
  ca_dropout:  0.4
  sparsemax_alpha: 1.5
  num_classes: 5
  classifier_dropout: 0.5
  final_dim:   32

training:
  epochs:      150
  batch_size:  32
  learning_rate:     1.0e-4
  max_learning_rate: 5.0e-4
  scheduler: "onecycle"
  onecycle_pct_start:        0.1
  onecycle_div_factor:       10.0
  onecycle_final_div_factor: 100.0
  # Final v2: wd 8e-3 (mạnh hơn default 5e-3) để regularize vanilla.
  # Train-Val gap +0.19 borderline nhưng Val-Test gap +0.02 → vanilla generalize OK.
  weight_decay:          8.0e-3
  node_emb_weight_decay: 1.5e-2
  focal_gamma:     2.0
  # Tuning 2026-05-24: disable class weighting để CIN (50% dataset) được full
  # optimization priority. Auto-computed alpha cho CIN=0.077 (lowest) → model bị
  # de-prioritize CIN → Acc thấp. Set uniform → CIN focus → Acc up.
  # Expected: Acc +0.02-0.03 (push trên MoXGATE 0.8219), F1m có thể giảm nhẹ.
  use_class_weights: false
  focal_alpha:     [1.0, 4.5, 1.5, 8.0, 2.0]   # ignored when use_class_weights=false
  label_smoothing: 0.05
  balanced_sampler: false
  lambda_frobenius: 0.002          # sync Stage 2A
  patience: 15                     # sync Stage 2A
  min_epochs: 40
  model_selection_metric: "val_f1"
  seed: 42
  loss_name: "focal"
  subtype_names: ["CIN", "GS", "MSI", "HM-SNV", "EBV"]
  minority_augmentation:
    enabled: true
    class: [1, 3, 4]   # GS=1, HM-SNV=3, EBV=4 — augment cả 3 minority trong STAD
    noise_std: 0.10
  # SWA v3 — keep OneCycle running, NO SWALR, always-pick. Vanilla preserved.
  swa:
    enabled: true
    start_epoch: 30
    update_freq: 1

logging:
  save_dir:     "/kaggle/working/checkpoints_gi_stad_only/"
  log_interval: 5
  print_classification_report: true

interpretability:
  top_k_features: 50
