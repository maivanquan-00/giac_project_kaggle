# BRCA v3 — Aggressive combo experiment to close gap with MoBRCA-net
# Target: vanilla Acc 0.87 → 0.90-0.92, F1m 0.81 → 0.85+
#
# Strategy: bigger model + balanced regularization + minority focus + longer train
# Multiple knobs simultaneously — accept tradeoff (hard to isolate which helps).
#
# Historical warning: hidden_dim=128 caused overfit (gap 0.03→0.07) trong setup cũ.
# v3 bù regularization mạnh hơn để balance: dropout up + Frobenius up + wd up.

data:
  data_dir:  "/kaggle/input/datasets/maivanquan/datn-2025-2/data_final_brca"
  graph_dir: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph"
  emqtl_dir: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph/BRCA_extend"
  manifest_file: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph/humanmethylation450_15017482_v1-2.csv"
  cancer_types: ["BRCA"]

preprocessing:
  # Features 3500 (rollback v2 4500 — over hurt minorities)
  gene_top_k:   3500
  meth_top_k:   3500
  mirna_top_k:  null
  feature_selection_method: "anova"
  val_size:  0.15
  cv_folds:  5
  # Boost mạnh hơn: tập trung features cho minority
  minority_boost_gene:  400       # was 200 baseline
  minority_boost_meth:  300       # was 150 baseline
  minority_boost_mirna: 0
  minority_classes: [1, 2, 4]    # Her2, LumA, Normal

graph:
  emqtl_pval_threshold:    0.05
  max_edges_per_node:      20
  max_coregulation_edges:  10
  ppi_score_threshold:     700
  use_ppi:          true
  use_reactome:     true
  use_mirna:        true
  use_mirna_family: true
  reactome_max_pathway_size: 50
  max_targets_per_mirna:    100
  use_cpg_island:      true
  cpg_island_relation: "Island"

model:
  # AGGRESSIVE: hidden 96 → 128 (re-test với regularization tăng)
  hidden_dim:  128
  gat_heads:   4                  # head_dim 128/4 = 32 (vs 96/4 = 24)
  gat_layers:  2
  # gat_dropout: 0.3 → 0.4 (bù capacity bigger)
  gat_dropout: 0.4
  # topk_seq: 32 → 48 (BRCA có nhiều markers, K=48 vẫn manageable)
  topk_seq:    48
  ca_heads:    4                  # head_dim 128/4 = 32 cho cross-attn
  # ca_dropout: 0.4 → 0.5 (bù regularization)
  ca_dropout:  0.5
  sparsemax_alpha: 1.5
  num_classes: 5
  # classifier_dropout: 0.55 → 0.65 (bù bigger hidden)
  classifier_dropout: 0.65
  final_dim:   32

training:
  # Longer training
  epochs:      200                # was 150
  batch_size:  32
  learning_rate:     1.0e-4
  max_learning_rate: 5.0e-4
  scheduler: "onecycle"
  onecycle_pct_start:        0.1
  onecycle_div_factor:       10.0
  onecycle_final_div_factor: 100.0
  # weight_decay 3e-3 → 5e-3 (bù bigger model)
  weight_decay:          5.0e-3
  node_emb_weight_decay: 2.0e-2    # also bump
  focal_gamma:     2.0
  # Manual focal_alpha — targeted boost Normal (n=36) + LumA (n=77)
  # Auto-compute baseline: [0.46, 1.27, 3.15, 1.47, 6.74] (post-normalize)
  # v3 manual: boost Normal stronger, LumA slight, others moderate
  use_manual_focal_alpha: true
  focal_alpha:     [0.5, 1.5, 2.5, 1.5, 5.0]   # Basal/Her2/LumA/LumB/Normal
  label_smoothing: 0.10           # was 0.05 — bù regularization
  balanced_sampler: false         # KHÔNG dùng — đã verify gây collapse trước
  # Frobenius regularization mạnh hơn
  lambda_frobenius: 0.003          # was 0.001
  # Longer patience để model converge fully
  patience: 25                     # was 20
  min_epochs: 50                   # NEW — ensure trained at least 50 epochs
  model_selection_metric: "val_f1"
  seed: 42
  loss_name: "focal"
  subtype_names: ["Basal", "Her2", "LumA", "LumB", "Normal"]
  # Minority augmentation noise stronger
  minority_augmentation:
    enabled: true
    class: [1, 2, 4]               # cả Her2, LumA, Normal
    noise_std: 0.15                # was 0.10

logging:
  save_dir:     "/kaggle/working/checkpoints_brca_v3/"
  log_interval: 5
  print_classification_report: true

interpretability:
  top_k_features: 50
