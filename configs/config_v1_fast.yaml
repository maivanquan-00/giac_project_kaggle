# GIAC v1 trên CÙNG đồ thị fast như config_v2_fast.yaml — để so apples-to-apples.
# Mục đích: biết per-patient GAT (v2) có thực sự hơn v1 không, khi đồ thị giống hệt.
# Khác config_v2_fast.yaml DUY NHẤT ở: model.arch = v1 (bỏ gat_chunk, v1 không dùng).

data:
  data_dir:  "/kaggle/input/datasets/maivanquan/datn-2025-2/data_final"
  graph_dir: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph"
  manifest_file: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph/humanmethylation450_15017482_v1-2.csv"
  cancer_types: ["COAD", "ESCA", "READ", "STAD"]

preprocessing:
  gene_top_k:   2000
  meth_top_k:   2000
  mirna_top_k:  null
  feature_selection_method: "anova"
  val_size:  0.15
  cv_folds:  5
  minority_boost_gene:  300
  minority_boost_meth:  200
  minority_boost_mirna: 0
  minority_classes: [1, 3, 4]
  stratify_by_cancer_type: true

graph:
  emqtl_pval_threshold:    0.05
  max_edges_per_node:      15
  max_coregulation_edges:  10
  ppi_score_threshold:     900
  use_ppi:          true
  use_reactome:     true
  use_mirna:        true
  use_mirna_family: true
  reactome_max_pathway_size: 30
  max_targets_per_mirna:    20
  use_cpg_island:      true
  cpg_island_relation: "Island+Shore"

model:
  arch: v1                         # <<< điểm khác duy nhất so với config_v2_fast
  hidden_dim:  96
  gat_heads:   4
  gat_layers:  2
  gat_dropout: 0.3
  topk_seq:    32
  ca_heads:    4
  ca_dropout:  0.4
  sparsemax_alpha: 1.5
  num_classes: 5
  classifier_dropout: 0.5
  final_dim:   32

training:
  epochs:      150
  batch_size:  32
  learning_rate:     1.0e-4
  max_learning_rate: 5.0e-4
  scheduler: "onecycle"
  onecycle_pct_start:        0.1
  onecycle_div_factor:       10.0
  onecycle_final_div_factor: 100.0
  weight_decay:          5.0e-3
  node_emb_weight_decay: 1.5e-2
  focal_gamma:     2.0
  use_manual_focal_alpha: true
  focal_alpha:     [0.077, 0.44, 0.35, 5.0, 1.63]
  label_smoothing: 0.05
  balanced_sampler: false
  lambda_frobenius: 0.002
  patience: 15
  min_epochs: 40
  model_selection_metric: "val_f1"
  seed: 42
  loss_name: "focal"
  subtype_names: ["CIN", "GS", "MSI", "HM-SNV", "EBV"]
  minority_augmentation:
    enabled: true
    class: [1, 3, 4]
    noise_std: 0.10

logging:
  save_dir:     "/kaggle/working/checkpoints_v1_fast/"
  log_interval: 5
  print_classification_report: true

interpretability:
  top_k_features: 50
