data:
  data_dir:  "/kaggle/input/datasets/maivanquan/datn-2025-2/data_final_brca"
  graph_dir: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph"
  emqtl_dir: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph/BRCA_extend"
  cancer_types: ["BRCA"]

preprocessing:
  gene_top_k:   3500
  meth_top_k:   3500
  mirna_top_k:  null      # BRCA: diagnostic FDR<0.05=573/602 (~95% signal) → GIỮ ALL, không cắt
  feature_selection_method: "anova"
  val_size:  0.15
  cv_folds:  5
  minority_boost_gene:  200
  minority_boost_meth:  150
  minority_boost_mirna: 0
  minority_classes: [1, 2, 4]   # Her2=1, LumA=2 (77 mẫu), Normal=4 (36 mẫu)

graph:    # relaxed 3-relation (đồng bộ GI baseline)
  emqtl_pval_threshold:    0.05
  max_edges_per_node:      12
  ppi_score_threshold:     800
  max_targets_per_mirna:   50
  use_emqtl:        true
  use_mirna:        true
  use_ppi:          true

model:
  hidden_dim:  96                # BRCA sweet spot (128 caused overfit, gap 0.03→0.07)
  gat_heads:   4
  gat_layers:  2
  gat_dropout: 0.3                # Phase 4c
  topk_seq:    32
  ca_heads:    4
  ca_dropout:  0.4
  sparsemax_alpha: 1.5
  num_classes: 5
  classifier_dropout: 0.55
  final_dim:   32

training:
  epochs:      150
  batch_size:  32
  learning_rate:     1.0e-4
  max_learning_rate: 5.0e-4
  scheduler: "onecycle"
  onecycle_pct_start:        0.1
  onecycle_div_factor:       10.0
  onecycle_final_div_factor: 100.0
  weight_decay:          3.0e-3
  node_emb_weight_decay: 1.5e-2
  focal_gamma:     2.0
  focal_alpha:     [1.0, 3.0, 1.0, 2.0, 3.0]   # overridden at runtime by compute_class_weights
  label_smoothing: 0.05
  balanced_sampler: false
  lambda_frobenius: 0.001
  patience: 20
  model_selection_metric: "val_f1"
  seed: 42
  loss_name: "focal"
  subtype_names: ["Basal", "Her2", "LumA", "LumB", "Normal"]
  minority_augmentation:
    enabled: true
    class: [1, 4]      # Her2=1, Normal=4 — minority classes của BRCA
    noise_std: 0.10

logging:
  save_dir:     "/kaggle/working/checkpoints/"
  log_interval: 5
  print_classification_report: true

interpretability:
  top_k_features: 50
