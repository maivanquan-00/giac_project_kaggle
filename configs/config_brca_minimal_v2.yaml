# BRCA 5-class — minimal graph + GAT cá thể hoá (arch v2). Cùng cách tiếp cận GI
# (config_minimal_graph_v2.yaml) nhưng data/hyperparams của BRCA → xem có generalize không.

data:
  data_dir:  "/kaggle/input/datasets/maivanquan/datn-2025-2/data_final_brca"
  graph_dir: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph"
  emqtl_dir: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph/BRCA_extend"
  manifest_file: "/kaggle/input/datasets/maivanquan/datn-2025-2/Heterogeneous_Graph/humanmethylation450_15017482_v1-2.csv"
  cancer_types: ["BRCA"]

preprocessing:
  gene_top_k:   3500
  meth_top_k:   3500
  mirna_top_k:  null      # BRCA: giữ all miRNA (chưa có diagnostic riêng cho BRCA)
  feature_selection_method: "anova"
  val_size:  0.15
  cv_folds:  5
  minority_boost_gene:  200
  minority_boost_meth:  150
  minority_boost_mirna: 0
  minority_classes: [1, 2, 4]   # Her2=1, LumA=2, Normal=4

graph:
  emqtl_pval_threshold:    0.05
  max_edges_per_node:      8       # minimal: thưa
  max_coregulation_edges:  10
  ppi_score_threshold:     900     # minimal
  # ── 3 quan hệ kinh điển ──
  use_emqtl:        true
  use_mirna:        true
  use_ppi:          true
  use_reactome:     false
  use_mirna_family: false
  use_coregulation: false
  use_cpg_island:   false
  reactome_max_pathway_size: 50
  max_targets_per_mirna:    15      # minimal
  cpg_island_relation: "Island"

model:
  arch: v2                         # <<< GAT cá thể hoá
  gat_chunk:   4                   # giảm 2 nếu OOM
  hidden_dim:  96
  gat_heads:   4
  gat_layers:  2
  gat_dropout: 0.3
  topk_seq:    32
  ca_heads:    4
  ca_dropout:  0.4
  sparsemax_alpha: 1.5
  num_classes: 5
  classifier_dropout: 0.55
  final_dim:   32

training:
  epochs:      150
  batch_size:  32
  learning_rate:     1.0e-4
  max_learning_rate: 5.0e-4
  scheduler: "onecycle"
  onecycle_pct_start:        0.1
  onecycle_div_factor:       10.0
  onecycle_final_div_factor: 100.0
  weight_decay:          3.0e-3
  node_emb_weight_decay: 1.5e-2
  focal_gamma:     2.0
  focal_alpha:     [1.0, 3.0, 1.0, 2.0, 3.0]   # overridden by compute_class_weights (auto)
  label_smoothing: 0.05
  balanced_sampler: false
  lambda_frobenius: 0.001
  patience: 20
  model_selection_metric: "val_f1"
  seed: 42
  loss_name: "focal"
  subtype_names: ["Basal", "Her2", "LumA", "LumB", "Normal"]
  minority_augmentation:
    enabled: true
    class: [1, 4]      # Her2=1, Normal=4
    noise_std: 0.10

logging:
  save_dir:     "/kaggle/working/checkpoints_brca_minimal_v2/"
  log_interval: 5
  print_classification_report: true

interpretability:
  top_k_features: 50
